# Builds an UNSIGNED .ipa of the native iOS app (Capacitor) on a macOS runner.
# Same steps as codemagic.yaml (the build itself is ios-app/scripts/build-ipa.sh).
# Sideloadly (or AltStore) signs it with your own Apple ID when installing.
# Download it from the run's "Artifacts" section (or `gh run download`).
name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build the bundled web app (no service worker)
        run: pnpm build:native

      - name: Generate the Xcode project
        run: bash ios-app/scripts/prepare-ios.sh

      - name: Build, package and check the unsigned .ipa
        run: bash ios-app/scripts/build-ipa.sh "${{ github.run_number }}"

      - uses: actions/upload-artifact@v7
        with:
          name: GrandmasterLab-unsigned-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
